<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duquès Hall Reservation System</title>
  <link rel="stylesheet" href="loginpage.css">
</head>
<body>
  <div class="page-title">Room Reservation System for Duquès Hall</div>
  <div class="login-container">
    <h1>Please Login with Your GWU Email</h1>
    <form id="loginForm" novalidate>
      <input type="email" id="email" placeholder="Enter your GWU email" autocomplete="email" required>
      <p id="loginError" class="login-error" role="alert" hidden></p>
      <button type="submit">Login</button>
    </form>
  </div>
  <script src="loginpage.js"></script>
</body>
</html>
